[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "quimil_soiling_loss_estimation"
version = "0.0.1"
description = "projeto de minera\u00e7\u00e3o de dados"
authors = [
  { name = "smirnoff" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "openpyxl>=3.1.5,<4",
    "pandas",
    "pyarrow>=18",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "seaborn>=0.13.2,<0.14",
    "setuptools<81",
    "ydata-profiling==4.18.4",
]
requires-python = "~=3.12.0"

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "nbclient>=0.10,<0.11",
    "nbformat>=5,<6",
]


[tool.ruff]
line-length = 99
src = ["quimil_soiling_loss_estimation"]
include = [
    "pyproject.toml",
    "quimil_soiling_loss_estimation/**/*.py",
    "notebooks/**/*.ipynb",
]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["quimil_soiling_loss_estimation"]
force-sort-within-sections = true

